<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Biznux 2D</title>
    <style>
      /* Dark backdrop; the scaled-up pixel canvas sits centered, crisp. */
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #0a0a12;
        overflow: hidden;
      }
      #game {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      /* Force nearest-neighbor scaling on the canvas (Phaser also sets this). */
      #game canvas {
        image-rendering: pixelated;
        image-rendering: crisp-edges;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
