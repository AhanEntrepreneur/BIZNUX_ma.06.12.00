<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dinomonz</title>
    <style>
      /* Fill the window with a dark backdrop so the scaled-up, pixel-perfect
         game canvas sits centered with no surrounding glare. */
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #0b0d1a;
        overflow: hidden;
      }
      #game {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      /* Force nearest-neighbor scaling on the canvas itself as a belt-and-braces
         measure (Phaser's pixelArt flag also does this). No blur, ever. */
      #game canvas {
        image-rendering: pixelated;
        image-rendering: crisp-edges;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
